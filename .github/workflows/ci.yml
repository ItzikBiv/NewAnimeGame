name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Config ground-truth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau
        run: |
          curl -sSL -o luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip
          chmod +x luau
          echo "LUAU=$PWD/luau" >> "$GITHUB_ENV"

      - name: Run config invariants
        run: ./scripts/run-tests.sh

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2

      # selene is scoped to src only. tests/ runs under the bare Luau CLI with
      # globals injected by scripts/run-tests.sh, so linting it against the
      # Roblox standard library would flag those as undefined.
      - name: Selene
        run: selene src

      - name: StyLua
        run: stylua --check src tests

  build:
    name: Rojo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Build place file
        run: rojo build -o RollAnimeToFight.rbxlx

      - uses: actions/upload-artifact@v4
        with:
          name: place-file
          path: RollAnimeToFight.rbxlx
